# QLoRA, rank 16, 2 epochs (RTX 5070, Task 7 model)
# Every setting is written here; finetune/train.py refuses a file that leaves one out.
# base_model and revision are filled in by Task 7 (the base model choice); until then
# the training refuses the placeholder. target_modules are the Qwen3.5 linear layers
# (full attention, Gated DeltaNet and MLP); change them if Task 7 picks another family.

base_model = "TASK-7-CHOOSES-THE-BASE-MODEL"
revision = "TASK-7-CHOOSES-THE-BASE-MODEL"
rank = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "in_proj_qkv", "in_proj_z", "out_proj", "gate_proj", "up_proj", "down_proj"]
learning_rate = 2e-4
epochs = 2
batch_size = 1
grad_accum = 16
max_seq_len = 3072
seed = 42
load_in_4bit = true
eval_steps = 50
early_stop_patience = 3
warmup_ratio = 0.03
gradient_checkpointing = true
max_steps = 0
train_limit = 0
val_limit = 0
sample = "seeded"
