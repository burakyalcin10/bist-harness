# QLoRA, rank 16, 2 epochs (RTX 5070, 12 GB): Qwen3.5 9B
# Every setting is written here; finetune/train.py refuses a file that leaves one out.
# Qwen/Qwen3.5-9B is the Hugging Face repository of the desktop's Ollama
# qwen3.5:9b-q4_K_M (same architecture, vocabulary and chat render; docs/results/
# 2026-11-18-finetune-training.md, section 9); the revision is a full commit.
# target_modules are the Qwen3.5 linear layers (full attention, Gated DeltaNet, MLP).
# Memory-lean path (Task 8b): embedding and output layer frozen in bf16, logits only at
# the target positions, 128 at a time. Fallback to 4B: docs/finetune.md, step 5.

base_model = "Qwen/Qwen3.5-9B"
revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
rank = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "in_proj_qkv", "in_proj_z", "out_proj", "gate_proj", "up_proj", "down_proj"]
learning_rate = 2e-4
epochs = 2
batch_size = 1
grad_accum = 16
max_seq_len = 3072
seed = 42
load_in_4bit = true
eval_steps = 50
early_stop_patience = 3
warmup_ratio = 0.03
gradient_checkpointing = true
max_steps = 0
train_limit = 0
val_limit = 0
sample = "seeded"
lean_memory = true
target_only_logits = true
logits_chunk = 128
